[package]
name = "beacon-alerts"
version = "0.1.0"
edition = "2021"
description = "Distributed event and alert notification system"
license = "Apache-2.0"
repository = "https://github.com/RogerioSobrinho/beacon-alerts"
readme = "README.md"
keywords = ["alerts", "notifications", "telegram", "events"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["v4", "fast-rng", "serde"] }
