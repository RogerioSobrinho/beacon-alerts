[package]
name = "beacon-alerts"
version = "0.1.0-rc6"
edition = "2021"
description = "Distributed event and alert notification system"
license = "Apache-2.0"
repository = "https://github.com/RogerioSobrinho/beacon-alerts"
readme = "README.md"
keywords = ["alerts", "notifications", "telegram", "events"]
categories = ["command-line-utilities", "web-programming::http-server"]

[features]
default = []
server = []

[[bin]]
name = "beacon-server"
path = "src/bin/beacon-server.rs"
required-features = ["server"]

[[bin]]
name = "beacon-agent"
path = "src/bin/beacon-agent.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["v4", "fast-rng", "serde"] }
