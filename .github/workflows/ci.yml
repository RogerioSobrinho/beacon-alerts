name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check client compilation
        run: cargo check --bin beacon-agent --no-default-features

      - name: Check server compilation
        run: cargo check --bin beacon-server --features server

      - name: Run client Clippy
        run: cargo clippy --bin beacon-agent --no-default-features -- -D warnings

      - name: Run server Clippy
        run: cargo clippy --bin beacon-server --features server -- -D warnings

      - name: Run client tests
        run: cargo test --no-default-features

      - name: Run server tests
        run: cargo test --features server
