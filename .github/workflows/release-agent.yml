name: Agent Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to receive agent assets"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64.tar.gz
            binary: beacon-agent
          - runner: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x86_64.tar.gz
            binary: beacon-agent
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64.tar.gz
            binary: beacon-agent
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.zip
            binary: beacon-agent.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build agent
        shell: bash
        run: cargo build --locked --release --no-default-features --bin beacon-agent --target "${{ matrix.target }}"

      - name: Package Unix agent
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/beacon-agent
          tar -C dist/package -czf "dist/beacon-agent-${RELEASE_TAG}-${{ matrix.suffix }}" beacon-agent

      - name: Package Windows agent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/beacon-agent.exe
          Compress-Archive -Path dist/package/beacon-agent.exe -DestinationPath "dist/beacon-agent-$env:RELEASE_TAG-${{ matrix.suffix }}"

      - name: Upload packaged agent
        uses: actions/upload-artifact@v4
        with:
          name: beacon-agent-${{ env.RELEASE_TAG }}-${{ matrix.suffix }}
          path: dist/beacon-agent-${{ env.RELEASE_TAG }}-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish agent assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged agents
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
