name: Agent Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to receive agent assets"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure prerelease exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Beacon $RELEASE_TAG" \
              --prerelease \
              --notes "Native beacon-agent assets for $RELEASE_TAG."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64.tar.gz
            binary: beacon-agent
          - runner: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x86_64.tar.gz
            binary: beacon-agent
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64.tar.gz
            binary: beacon-agent
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.zip
            binary: beacon-agent.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build agent
        shell: bash
        run: cargo build --locked --release --no-default-features --bin beacon-agent --target "${{ matrix.target }}"

      - name: Package Unix agent
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/beacon-agent
          tar -C dist/package -czf "dist/beacon-agent-${RELEASE_TAG}-${{ matrix.suffix }}" beacon-agent

      - name: Package Windows agent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/beacon-agent.exe
          Compress-Archive -Path dist/package/beacon-agent.exe -DestinationPath "dist/beacon-agent-$env:RELEASE_TAG-${{ matrix.suffix }}"

      - name: Publish packaged agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/beacon-agent-${RELEASE_TAG}-${{ matrix.suffix }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
